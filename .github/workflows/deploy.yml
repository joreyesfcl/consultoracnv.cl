# Publica el sitio en GitHub Pages cada vez que se actualiza la rama main.
# En los pull requests solo compila y corre la prueba de accesibilidad, sin publicar.
# Requisito (una vez): GitHub → Settings → Pages → Source: "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Las publicaciones van en fila; la revisión de un PR se reinicia si llega un commit nuevo.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Prueba de accesibilidad (WCAG 2.2 A/AA, teclado y reflujo). Si falla, no se publica.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
